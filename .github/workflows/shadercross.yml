name: Shadercross image and shaders

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/shadercross.yml
      - tools/shadercross/**
      - templates/pong/src/tgc/gpu/shaders/**
  pull_request:
    paths:
      - .github/workflows/shadercross.yml
      - tools/shadercross/**
      - templates/pong/src/tgc/gpu/shaders/**

concurrency:
  group: shadercross-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/20gc-shadercross
  SHADER_DIRECTORY: templates/pong/src/tgc/gpu/shaders

jobs:
  build-and-validate:
    name: Build image and validate shaders
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve vcpkg revision
        id: vcpkg
        run: echo "commit=$(git rev-parse HEAD:extern/vcpkg)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shadercross image
        uses: docker/build-push-action@v6
        with:
          context: tools/shadercross
          file: tools/shadercross/Dockerfile
          platforms: linux/amd64
          build-args: VCPKG_COMMIT=${{ steps.vcpkg.outputs.commit }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=shadercross-amd64
          cache-to: type=gha,mode=max,scope=shadercross-amd64

      - name: Pull image produced by this run
        if: github.event_name != 'pull_request'
        run: docker pull "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Regenerate shaders
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE/$SHADER_DIRECTORY:/shaders" \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            ./build-shaders.sh

      - name: Verify checked-in shaders
        run: |
          changes="$(git status --porcelain --untracked-files=all -- "$SHADER_DIRECTORY/generated")"
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes"
            git diff -- "$SHADER_DIRECTORY/generated"
            exit 1
          fi

      - name: Publish validated image as latest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
